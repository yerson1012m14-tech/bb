name: Build JASONXIT iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.h'
      - '**/*.plist'
      - '**/*.pbxproj'
      - '**/*.yml'
      - 'project.yml'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if ls -d /Applications/Xcode_15.4*.app >/dev/null 2>&1; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            echo "Xcode 15.4 not found; using the runner default Xcode."
          fi
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project JASONXIT.xcodeproj \
            -scheme JASONXIT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/JASONXIT.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive | tee build-xcodebuild.log

      - name: Create unsigned IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/JASONXIT.xcarchive/Products/Applications/JASONXIT.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/JASONXIT.app
          (cd build/ipa && /usr/bin/zip -qry ../JASONXIT-unsigned.ipa Payload)
          ls -lh build/JASONXIT-unsigned.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JASONXIT-iOS-build
          path: |
            build/JASONXIT-unsigned.ipa
            build/JASONXIT.xcarchive
            build-xcodebuild.log
          if-no-files-found: error
